services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-container
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB: langchain
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: PGAdmin for database management (useful for students)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bootcamp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - pgvector
    restart: unless-stopped

volumes:
  pgvector_data:
    driver: local

# Usage:
# 1. Start all services: docker compose up -d
# 2. Check status: docker-compose ps
# 3. View logs: docker-compose logs -f pgvector
# 4. Stop all services: docker-compose down
# 5. Stop and remove data: docker-compose down -v
#
# Access:
# - PostgreSQL: localhost:5432
# - PGAdmin: http://localhost:5050 (admin@bootcamp.com / admin)
#
# Connect to PGVector from PGAdmin:
# - Host: pgvector
# - Port: 5432
# - Username: postgres
# - Password: postgres
# - Database: rag_production
